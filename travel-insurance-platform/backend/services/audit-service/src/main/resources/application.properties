spring.application.name=audit-service
server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_AUDIT_USER:ins_audit_svc}
spring.datasource.password=${DB_AUDIT_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# INSERT+SELECT only — DB-level RLS enforces immutability
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_audit
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IHRoYXQgbXVzdCBiZSBhdCBsZWFzdCA1MTIgYml0cyBsb25nIGZvciBIUzUxMg==}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7
app.jwt.issuer=travel-insurance-platform

management.endpoints.web.exposure.include=health,info
logging.level.com.insurance=INFO
