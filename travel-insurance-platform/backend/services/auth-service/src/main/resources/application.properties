spring.application.name=auth-service
server.port=8081

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_AUTH_USER:ins_auth_svc}
spring.datasource.password=${DB_AUTH_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_auth
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (managed centrally via database/schema — disabled per-service) ---
spring.flyway.enabled=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IHRoYXQgbXVzdCBiZSBhdCBsZWFzdCA1MTIgYml0cyBsb25nIGZvciBIUzUxMg==}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7
app.jwt.issuer=travel-insurance-platform

# --- App config ---
app.login.max-failed-attempts=5
app.login.lock-duration-minutes=30
app.otp.expiry-minutes=10
app.otp.resend-cooldown-seconds=60
app.password.history-limit=5

# --- Mail ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=noreply@travelsure.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.insurance=INFO
logging.level.org.springframework.security=WARN
