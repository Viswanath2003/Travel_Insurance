spring.application.name=pricing-service
server.port=8086

# DataSource — reads ins_product schema (read-only, shared DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_PRODUCT_USER:ins_product_svc}
spring.datasource.password=${DB_PRODUCT_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_product
spring.flyway.enabled=false

# JWT (must match auth-service secret)
app.jwt.secret=dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qdC10b2tlbi12YWxpZGF0aW9u
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000
app.jwt.issuer=travel-insurance-platform

# Downstream service URLs
app.services.rule-engine-url=http://localhost:8085
app.services.audit-url=http://localhost:8091

# Tax rate (configurable)
app.pricing.tax-rate=0.09

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.insurance=INFO
logging.level.org.springframework.security=WARN
