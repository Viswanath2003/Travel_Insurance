spring.application.name=field-service
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_FIELD_USER:ins_field_svc}
spring.datasource.password=${DB_FIELD_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_field
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IHRoYXQgbXVzdCBiZSBhdCBsZWFzdCA1MTIgYml0cyBsb25nIGZvciBIUzUxMg==}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7
app.jwt.issuer=travel-insurance-platform

app.evidence.upload-root=${UPLOAD_ROOT:/opt/insurance/storage/field-evidence}

services.claims.url=${CLAIMS_SERVICE_URL:http://localhost:8088}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
services.audit.url=${AUDIT_SERVICE_URL:http://localhost:8091}

management.endpoints.web.exposure.include=health,info
logging.level.com.insurance=INFO
