spring.application.name=policy-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_POLICY_USER:ins_policy_svc}
spring.datasource.password=${DB_POLICY_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_policy
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IHRoYXQgbXVzdCBiZSBhdCBsZWFzdCA1MTIgYml0cyBsb25nIGZvciBIUzUxMg==}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7
app.jwt.issuer=travel-insurance-platform

app.quote.validity-hours=48
app.policy.renewal-advance-notify-days=30

services.pricing.url=${PRICING_SERVICE_URL:http://localhost:8086}
services.rule-engine.url=${RULE_ENGINE_SERVICE_URL:http://localhost:8085}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}

management.endpoints.web.exposure.include=health,info
logging.level.com.insurance=INFO
