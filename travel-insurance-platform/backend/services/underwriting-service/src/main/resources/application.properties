spring.application.name=underwriting-service
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/ins_travelinsurance
spring.datasource.username=${DB_UW_USER:ins_uw_svc}
spring.datasource.password=${DB_UW_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ins_underwriting
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IHRoYXQgbXVzdCBiZSBhdCBsZWFzdCA1MTIgYml0cyBsb25nIGZvciBIUzUxMg==}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7
app.jwt.issuer=travel-insurance-platform

app.scheduler.uw-sla-check-cron=0 */15 * * * *

services.policy.url=${POLICY_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
services.audit.url=${AUDIT_SERVICE_URL:http://localhost:8091}

management.endpoints.web.exposure.include=health,info
logging.level.com.insurance=INFO
