<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Portal – PolicyPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <header class="app-header">
    <a class="app-logo" href="#" onclick="navigate('dashboard');return false">
      <div class="app-logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6L12 2z" fill="white"/></svg></div>
      <div><span class="app-logo-text">PolicyPilot</span><span class="app-logo-sub">Finance Portal</span></div>
    </a>
    <div class="header-right">
      <button class="notif-btn" onclick="openNotifDrawer(getSession().role)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notif-badge" style="display:none">0</span></button>
      <div id="user-chip-header"></div>
      <button class="btn btn-ghost btn-sm" style="color:rgba(255,255,255,0.6)" onclick="doLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
    </div>
  </header>
  <div class="app-body">
    <aside class="app-sidebar" id="sidebar">
      <button class="sidebar-item" data-section="dashboard" onclick="navigate('dashboard')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</button>
      <button class="sidebar-item" data-section="premiums" onclick="navigate('premiums')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Premium Collections</button>
      <button class="sidebar-item" data-section="payouts" onclick="navigate('payouts')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Claims Payouts <span class="badge">6</span></button>
      <button class="sidebar-item" data-section="reconciliation" onclick="navigate('reconciliation')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/></svg>Reconciliation</button>
      <div class="sidebar-divider"></div>
      <button class="sidebar-item" data-section="reports" onclick="navigate('reports')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Financial Reports</button>
      <button class="sidebar-item" data-section="audit" onclick="navigate('audit')"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Audit Ledger</button>
      <div class="sidebar-logout"><div class="sidebar-divider"></div>
        <button class="sidebar-item" onclick="doLogout()"><svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</button>
      </div>
    </aside>
    <main class="app-main" id="app-main"></main>
  </div>
</div>
<script src="../../shared/utils.js"></script>
<script src="../../shared/validators.js"></script>
<script src="app.js"></script>
<script>
  const _user = requireAnyAuth();
  if (_user) { document.getElementById('user-chip-header').innerHTML = renderUserChip(_user); updateNotifBadge(_user.role); navigate('dashboard'); }
</script>
</body>
</html>
