<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – PolicyPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-left">
    <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center">
      <svg width="180" height="160" viewBox="0 0 180 160" fill="none">
        <circle cx="90" cy="80" r="50" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <path d="M65 80 Q65 65 80 65 Q85 65 88 68 L90 72 L92 68 Q95 65 100 65 Q115 65 115 80 L90 105Z" fill="rgba(0,194,168,0.3)" stroke="rgba(0,194,168,0.6)" stroke-width="1.5"/>
        <circle cx="90" cy="85" r="4" fill="white" opacity="0.8"/>
        <rect x="86" y="91" width="8" height="3" rx="1.5" fill="white" opacity="0.8"/>
      </svg>
      <div class="auth-brand">Reset Password</div>
      <div class="auth-tagline">No worries, we'll help you reset it quickly and securely</div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6L12 2z" fill="white"/></svg></div>
      <div><span class="auth-logo-text">PolicyPilot</span><span class="auth-logo-sub">Adaptive Travel Insurance</span></div>
    </div>
    <h1 class="auth-title">Forgot Password?</h1>
    <p class="auth-subtitle">Enter your email or mobile number and we'll send you a reset link.</p>

    <div class="tabs" style="margin-bottom:24px">
      <button class="tab-item active forgot-tab" onclick="switchForgotTab(this,'email')">Email</button>
      <button class="tab-item forgot-tab" onclick="switchForgotTab(this,'mobile')">Mobile</button>
    </div>

    <div id="forgot-email-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="form-input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com"
            oninput="clearErr('forgot-email-error')" onblur="setErr('forgot-email-error', Validators.email(this.value.trim()))">
        </div>
        <div id="forgot-email-error" class="form-error"></div>
      </div>
    </div>

    <div id="forgot-mobile-form" class="hidden">
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <div class="flex gap-2">
          <select class="form-select" style="width:110px;flex-shrink:0">
            <option>🇮🇳 +91</option><option>🇺🇸 +1</option><option>🇬🇧 +44</option><option>🇦🇪 +971</option>
          </select>
          <input type="tel" id="forgot-mobile" class="form-input" placeholder="9876543210"
            oninput="clearErr('forgot-mobile-error')" onblur="setErr('forgot-mobile-error', Validators.phone(this.value.trim()))">
        </div>
        <div id="forgot-mobile-error" class="form-error"></div>
      </div>
    </div>

    <button class="btn btn-primary btn-block btn-lg mt-2" onclick="doForgotPassword()">Send Reset Link</button>
    <p style="text-align:center;margin-top:20px">
      <a href="index.html" class="link text-sm">← Back to Login</a>
    </p>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script src="auth.js"></script>
</body>
</html>
