<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP – PolicyPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-left">
    <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center">
      <svg width="180" height="180" viewBox="0 0 180 180" fill="none">
        <rect x="50" y="40" width="80" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        <rect x="60" y="55" width="60" height="90" rx="6" fill="rgba(255,255,255,0.05)"/>
        <circle cx="90" cy="150" r="5" fill="rgba(255,255,255,0.3)"/>
        <path d="M72 95 L80 103 L108 75" stroke="#00C2A8" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="90" cy="70" r="10" fill="rgba(0,194,168,0.2)" stroke="rgba(0,194,168,0.5)" stroke-width="1.5"/>
      </svg>
      <div class="auth-brand">Verify It's You</div>
      <div class="auth-tagline">We've sent a 6-digit OTP to your registered email or mobile number</div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6L12 2z" fill="white"/></svg></div>
      <div><span class="auth-logo-text">PolicyPilot</span><span class="auth-logo-sub">Adaptive Travel Insurance</span></div>
    </div>
    <h1 class="auth-title">Enter OTP</h1>
    <p class="auth-subtitle">
      We've sent a 6-digit OTP to <strong id="otp-email-display">your email</strong>
    </p>
    <div class="otp-group">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,0)" onkeydown="otpKeydown(this,0,event)">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,1)" onkeydown="otpKeydown(this,1,event)">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,2)" onkeydown="otpKeydown(this,2,event)">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,3)" onkeydown="otpKeydown(this,3,event)">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,4)" onkeydown="otpKeydown(this,4,event)">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
        oninput="otpInput(this,5)" onkeydown="otpKeydown(this,5,event)">
    </div>
    <div id="otp-error" class="form-error" style="text-align:center;margin-bottom:12px;justify-content:center"></div>

    <button class="btn btn-primary btn-block btn-lg" onclick="verifyOTP()">Verify OTP</button>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray-500)">
      Didn't receive OTP?
      <a href="#" class="link" id="resend-link" onclick="handleResend();return false">
        Resend (<span id="otp-timer">01:00</span>)
      </a>
    </p>
    <p style="text-align:center;margin-top:8px">
      <a href="index.html" class="link text-sm">← Back to Login</a>
    </p>
    <div class="alert alert-info mt-4" style="font-size:12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Demo: Enter any 6 digits to proceed.
    </div>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script src="auth.js"></script>
<script>
  (function(){
    const pending = sessionStorage.getItem('ti_pending_login');
    if (!pending) window.location.replace('index.html');
    initOTPPage();
  })();

  function handleResend() {
    const el = document.getElementById('otp-timer');
    if (el && el.textContent !== '00:00') return;
    resendOTP();
  }
</script>
</body>
</html>
